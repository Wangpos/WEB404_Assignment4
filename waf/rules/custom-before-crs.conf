# =============================================================================
#  VulnShop custom WAF rules - loaded BEFORE the OWASP Core Rule Set
#  (mounted as REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf)
#
#  WEB404 Assignment 4. Rule IDs 10000-19999 are reserved for this project
#  (ModSecurity reserves 1-99,999 for local use).
#
#  The CRS is a NEGATIVE security model: it looks for known-bad patterns.
#  The rules here add a POSITIVE security model (allow-lists) for the
#  application's known parameters. These "virtual patches" stop an attack
#  class outright, including payloads that the generic signatures miss.
#
#  Sections
#    A. Brute-force protection (rate limiting failed logins per client IP)
#    B. Virtual patches for each vulnerable endpoint (allow-list validation)
#    C. Access control at the edge (internal paths, HTTP methods)
#    D. False-positive tuning (rule exclusions) for legitimate traffic
# =============================================================================


# -----------------------------------------------------------------------------
# A. Brute-force protection
# -----------------------------------------------------------------------------
# Open a per-client-IP persistent collection. The failed-login counter is
# incremented in RESPONSE-999 (phase 3) whenever /login answers 401.
SecAction \
    "id:10000,\
    phase:1,\
    pass,\
    nolog,\
    initcol:ip=%{REMOTE_ADDR}"

# Lock the client out of /login once it has 5 failures inside 60 seconds.
SecRule REQUEST_FILENAME "@streq /login" \
    "id:10001,\
    phase:1,\
    deny,\
    status:429,\
    log,\
    msg:'Brute force protection: too many failed logins from %{REMOTE_ADDR}',\
    logdata:'failed_logins=%{ip.failed_logins}',\
    tag:'vulnshop/brute-force',\
    tag:'attack-bruteforce',\
    severity:'WARNING',\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "chain"
        SecRule IP:failed_logins "@ge 5" \
            "t:none"


# -----------------------------------------------------------------------------
# B. Virtual patches (positive security model)
# -----------------------------------------------------------------------------
# B1. Login - usernames are alphanumeric. Kills SQL injection via the
#     username field regardless of encoding or obfuscation.
SecRule REQUEST_FILENAME "@streq /login" \
    "id:10100,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Virtual patch: /login username failed allow-list validation',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'vulnshop/virtual-patch',\
    tag:'attack-sqli',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:username "!@rx ^[A-Za-z0-9_.@-]{1,64}$" \
        "t:none"

# B2. Product detail - id must be a positive integer (blind SQLi).
SecRule REQUEST_FILENAME "@streq /product" \
    "id:10110,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Virtual patch: /product id must be numeric',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'vulnshop/virtual-patch',\
    tag:'attack-sqli',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:id "!@rx ^[0-9]{1,9}$" \
        "t:none"

# B3. Product search - free text is legitimate, so instead of an allow-list
#     we deny the SQL meta-characters that are never needed in a product name
#     search: comment sequences, statement terminators and quote+keyword
#     combinations. Apostrophes on their own (O'Reilly) are still allowed.
SecRule REQUEST_FILENAME "@streq /products" \
    "id:10120,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Virtual patch: SQL syntax in /products search term',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'vulnshop/virtual-patch',\
    tag:'attack-sqli',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:q "@rx (?:--|/\*|\*/|;|#|\|\||'\s*(?:or|and|union|select|order|group|having|like)\b|\bunion\b[\s\S]*\bselect\b)" \
        "t:none,t:urlDecodeUni,t:lowercase,t:compressWhitespace"

# B4. Ping tool - host must be an IPv4 address or a DNS name (OS command
#     injection). No shell metacharacter can pass this pattern.
SecRule REQUEST_FILENAME "@streq /tools/ping" \
    "id:10130,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Virtual patch: /tools/ping host must be a hostname or IPv4 address',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'vulnshop/virtual-patch',\
    tag:'attack-rce',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:host "!@rx ^[A-Za-z0-9](?:[A-Za-z0-9.-]{0,252})$" \
        "t:none"

# B5. Documentation viewer - only bare file names with a known extension
#     (directory traversal / LFI). Rejects '/', '\', '..', NUL and encodings.
SecRule REQUEST_FILENAME "@streq /docs" \
    "id:10140,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Virtual patch: /docs file must be a plain document name',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'vulnshop/virtual-patch',\
    tag:'attack-lfi',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:file "!@rx ^[A-Za-z0-9_-]{1,64}\.(?:txt|md)$" \
        "t:none"

# B6. File upload - extension allow-list on the ORIGINAL file name. This
#     also blocks double extensions (shell.php.jpg) and path components
#     (../../app.py) because only one dot and no slashes are permitted.
SecRule REQUEST_FILENAME "@streq /upload" \
    "id:10150,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'File upload: file name or extension not allowed',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'vulnshop/virtual-patch',\
    tag:'attack-file-upload',\
    severity:'CRITICAL',\
    chain"
    SecRule FILES "!@rx ^[A-Za-z0-9_-]{1,100}\.(?:png|jpe?g|gif|pdf)$" \
        "t:none"

# B7. File upload - content inspection. An "image" containing server-side
#     script, HTML/JS or a shebang is rejected whatever its name says.
SecRule REQUEST_FILENAME "@streq /upload" \
    "id:10151,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'File upload: active content detected inside uploaded file',\
    tag:'vulnshop/virtual-patch',\
    tag:'attack-file-upload',\
    severity:'CRITICAL',\
    chain"
    SecRule REQUEST_BODY "@rx (?i)(?:<\?(?:php|=)|<%[=@]?|<script\b|<svg\b[^>]*\bon\w+=|#!\s*/(?:usr/)?bin/)" \
        "t:none"

# B8. File upload - size limit (2 MB per request).
SecRule FILES_COMBINED_SIZE "@gt 2097152" \
    "id:10152,\
    phase:2,\
    deny,\
    status:413,\
    log,\
    msg:'File upload: combined upload size exceeds 2 MB',\
    tag:'vulnshop/virtual-patch',\
    tag:'attack-file-upload',\
    severity:'WARNING'"

# B9. URL preview - SSRF. Allow-list of schemes AND hosts (descriptor 3.6.2
#     "whitelisting allowed resources and URLs"). Blocks file://, gopher://,
#     loopback, link-local metadata, decimal/hex IP tricks and user@host.
SecRule REQUEST_FILENAME "@streq /fetch" \
    "id:10160,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Virtual patch: /fetch URL is not on the allow-list (SSRF)',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'vulnshop/virtual-patch',\
    tag:'attack-ssrf',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:url "!@rx ^https://(?:www\.)?(?:example\.com|example\.org|wikipedia\.org)(?:/[A-Za-z0-9._~%/-]*)?$" \
        "t:none"

# B10. Greeting - display names only (reflected XSS).
SecRule REQUEST_FILENAME "@streq /greet" \
    "id:10170,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Virtual patch: /greet name must be plain text',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'vulnshop/virtual-patch',\
    tag:'attack-xss',\
    severity:'CRITICAL',\
    chain"
    SecRule ARGS:name "!@rx ^[A-Za-z0-9 .'-]{1,50}$" \
        "t:none"

# B11. Report - year must be a 4 digit number (stops the stack-trace leak
#      at the source instead of only filtering the response).
SecRule REQUEST_FILENAME "@streq /report" \
    "id:10180,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Virtual patch: /report year must be a 4 digit year',\
    logdata:'%{MATCHED_VAR_NAME}=%{MATCHED_VAR}',\
    tag:'vulnshop/virtual-patch',\
    severity:'WARNING',\
    chain"
    SecRule ARGS:year "!@rx ^(?:19|20)[0-9]{2}$" \
        "t:none"


# -----------------------------------------------------------------------------
# C. Access control at the edge
# -----------------------------------------------------------------------------
# C1. Internal endpoints must never be reachable from outside.
SecRule REQUEST_FILENAME "@beginsWith /internal/" \
    "id:10200,\
    phase:1,\
    deny,\
    status:404,\
    log,\
    msg:'Access control: internal endpoint requested from outside',\
    tag:'vulnshop/access-control',\
    severity:'WARNING'"

# C2. Sensitive files and backups (also covered by CRS 930130 / 920440, kept
#     here so protection does not depend on CRS paranoia/tuning).
SecRule REQUEST_FILENAME "@rx (?i)(?:/\.(?:env|git|svn|hg|htaccess|htpasswd|DS_Store)|\.(?:bak|backup|old|orig|sql|sqlite|db|swp)$|/backup/)" \
    "id:10210,\
    phase:1,\
    deny,\
    status:404,\
    log,\
    msg:'Access control: request for sensitive file or backup',\
    logdata:'%{REQUEST_FILENAME}',\
    tag:'vulnshop/access-control',\
    tag:'attack-disclosure',\
    severity:'WARNING'"

# C3. The application only uses GET, HEAD and POST.
SecRule REQUEST_METHOD "!@within GET HEAD POST" \
    "id:10220,\
    phase:1,\
    deny,\
    status:405,\
    log,\
    msg:'Method %{REQUEST_METHOD} not allowed',\
    tag:'vulnshop/access-control',\
    severity:'WARNING'"


# -----------------------------------------------------------------------------
# D. False-positive tuning
# -----------------------------------------------------------------------------
# The feedback form accepts free-form English prose that is stored with a
# parameterised INSERT and output-encoded on display. At paranoia level 2+
# ordinary sentences ("select ... from ...", "drop by", "; I'd like")
# trigger SQLi/RCE keyword rules. Exclude ONLY the message field, ONLY on
# this URL, ONLY from those rule groups - the rest of CRS still applies.
SecRule REQUEST_FILENAME "@streq /feedback" \
    "id:10300,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:message,\
    ctl:ruleRemoveTargetByTag=attack-rce;ARGS:message"
