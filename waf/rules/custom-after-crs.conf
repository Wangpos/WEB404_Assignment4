# =============================================================================
#  VulnShop custom WAF rules - loaded AFTER the OWASP Core Rule Set
#  (mounted as RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf)
#
#  Response-side rules: they see what the application sends back, so they
#  can catch information disclosure even when an attack was not recognised
#  on the way in (defence in depth for "2.4 Information Disclosure").
#
#  IMPORTANT - tested limitation: with ModSecurity-nginx v1.0.4 a phase:4
#  (RESPONSE_BODY) match is logged but the response has already been
#  streamed to the client, so the 'deny' is NOT effective. These rules are
#  therefore used for DETECTION / ALERTING; actual prevention of 5xx error
#  leakage is done by nginx 'proxy_intercept_errors' (waf/nginx/) and of
#  the root causes by the request-side virtual patches (phase 2).
# =============================================================================

# -----------------------------------------------------------------------------
# A. Brute-force protection - count failed logins (see rule 10001)
# -----------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@streq /login" \
    "id:10500,\
    phase:3,\
    pass,\
    log,\
    msg:'Failed login recorded for %{REMOTE_ADDR}',\
    logdata:'failed_logins_before_this_request=%{ip.failed_logins}',\
    tag:'vulnshop/brute-force',\
    chain"
    SecRule RESPONSE_STATUS "@streq 401" \
        "setvar:ip.failed_logins=+1,\
        expirevar:ip.failed_logins=60"

# -----------------------------------------------------------------------------
# B. Information disclosure in responses
# -----------------------------------------------------------------------------
# B1. Python stack traces.
SecRule RESPONSE_BODY "@rx Traceback \(most recent call last\)|File \"/[^\"]+\.py\", line \d+" \
    "id:10510,\
    phase:4,\
    deny,\
    status:500,\
    log,\
    msg:'Information leakage: Python stack trace in response',\
    tag:'vulnshop/data-leakage',\
    tag:'attack-disclosure',\
    severity:'ERROR'"

# B2. Database error messages and echoed SQL queries.
SecRule RESPONSE_BODY "@rx (?i)sqlite3\.\w*Error|\bQuery: SELECT\b|SQLITE_ERROR|near \"[^\"]*\": syntax error" \
    "id:10511,\
    phase:4,\
    deny,\
    status:500,\
    log,\
    msg:'Information leakage: database error message in response',\
    tag:'vulnshop/data-leakage',\
    tag:'attack-disclosure',\
    severity:'ERROR'"

# B3. Secrets / credentials that must never leave the server.
SecRule RESPONSE_BODY "@rx (?:\bAKIA[0-9A-Z]{12,}|(?i:secret_key|db_password|aws_access_key_id)\s*[=:]|root:[x*]?:0:0:|-----BEGIN (?:RSA |EC )?PRIVATE KEY)" \
    "id:10512,\
    phase:4,\
    deny,\
    status:500,\
    log,\
    msg:'Information leakage: credential or system file content in response',\
    tag:'vulnshop/data-leakage',\
    tag:'attack-disclosure',\
    severity:'CRITICAL'"
