<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VulnShop{% endblock %} · VulnShop</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#5b6475; --accent:#b4232c; --line:#e3e6eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
    header { background:#1d2330; color:#fff; padding:14px 24px; display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
    header a { color:#cfd6e4; text-decoration:none; font-size:14px; }
    header a:hover { color:#fff; }
    header .brand { font-weight:700; color:#fff; font-size:18px; margin-right:12px; }
    .warn { background:var(--accent); color:#fff; text-align:center; font-size:13px; padding:6px; }
    main { max-width:900px; margin:28px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:22px 26px; }
    h1 { font-size:22px; margin-top:0; }
    table { border-collapse:collapse; width:100%; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
    input, textarea { width:100%; padding:9px; border:1px solid var(--line); border-radius:6px; font:inherit; margin:4px 0 12px; }
    button { background:#1d2330; color:#fff; border:0; padding:9px 18px; border-radius:6px; cursor:pointer; }
    pre { background:#0f141d; color:#d7dde8; padding:14px; border-radius:6px; overflow:auto; white-space:pre-wrap; }
    .ok { color:#17703b; } .bad, .err { color:var(--accent); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
    .grid a { display:block; padding:14px; border:1px solid var(--line); border-radius:8px; text-decoration:none; color:var(--ink); background:#fff; }
    .grid a small { display:block; color:var(--muted); margin-top:4px; }
  </style>
</head>
<body>
  <div class="warn">Intentionally vulnerable training application · WEB404 Assignment 4 · do not expose to a network</div>
  <header>
    <span class="brand">VulnShop</span>
    <a href="/">Home</a><a href="/login">Login</a><a href="/products?q=">Products</a>
    <a href="/tools/ping">Ping tool</a><a href="/docs">Docs</a><a href="/upload">Upload</a>
    <a href="/fetch">URL preview</a><a href="/feedback">Feedback</a>
  </header>
  <main><div class="card">{% block content %}{% endblock %}</div></main>
</body>
</html>
